<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HANGOVER — Ticket Status</title>
  <style>
    body{font-family:Arial,sans-serif;background:#0b0a0d;color:#ede8e2;text-align:center;padding:60px 20px}
    .card{max-width:560px;margin:auto;padding:38px;border:1px solid #2b272d;border-radius:20px;background:#151217}
    h1{margin-bottom:12px}
    p{color:#aaa;line-height:1.6}
    .button{display:inline-block;margin-top:25px;padding:14px 24px;background:#d4af6a;color:#0b0a0d;text-decoration:none;border-radius:8px;font-weight:700}
    .button.disabled{opacity:.45;pointer-events:none}
    .id{font-family:monospace;color:#d4af6a}
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Checking your booking…</h1>
    <p id="message">Please wait while we check the latest payment status.</p>
    <p id="bookingLine"></p>
    <a id="downloadTicket" class="button disabled">Download Ticket</a>
    <p><a href="/" style="color:#d4af6a;">Return to HANGOVER</a></p>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const bookingId = params.get('bookingId');
  const title = document.getElementById('title');
  const message = document.getElementById('message');
  const bookingLine = document.getElementById('bookingLine');
  const button = document.getElementById('downloadTicket');

  async function checkStatus(){
    if(!bookingId){
      title.textContent = 'Booking ID Missing';
      message.textContent = 'We could not identify your booking.';
      return;
    }

    bookingLine.innerHTML = `Booking ID: <span class="id">${bookingId}</span>`;

    try{
      const res = await fetch(`/api/payments/status/${encodeURIComponent(bookingId)}`);
      const data = await res.json();

      if(!res.ok) throw new Error(data.message || 'Unable to check booking.');

      if(data.paymentStatus === 'Paid'){
        title.textContent = '🎉 Payment Confirmed!';
        message.textContent = 'Your HANGOVER payment has been verified and your ticket is ready.';
        button.href = `/api/bookings/ticket/${encodeURIComponent(bookingId)}`;
        button.classList.remove('disabled');
      } else {
        title.textContent = 'Payment Pending';
        message.textContent = 'Your transaction has been submitted. The event team will verify it and your ticket will be issued once payment is confirmed.';
        setTimeout(checkStatus, 10000);
      }
    }catch(err){
      title.textContent = 'Unable to Check Status';
      message.textContent = err.message;
    }
  }

  checkStatus();
</script>
</body>
</html>
